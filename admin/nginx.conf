# Docker's embedded DNS (127.0.0.11) re-resolves the "server" hostname on
# every TTL instead of once at nginx startup — same gotcha as the gateway's
# own config; without this, nginx caches the server container's old IP
# forever and returns 502s the moment that container is recreated.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self'" always;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Proxies the admin SPA's API calls to the backend container directly, so
    # the browser sees admin + API as the same origin — no CORS, and no
    # cross-site cookie issues for the refresh-token cookie. Mirrors the
    # gateway's own /api/ block; see its comments for the proxy_pass gotcha.
    location /api/ {
        set $upstream_server server:4000;
        proxy_pass http://$upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /api/auth /api/auth;
    }

    # Fingerprinted assets (Vite hashes filenames) can be cached forever.
    # nginx quirk: a location with its own add_header replaces the
    # server-level list for that location rather than adding to it, so the
    # security headers above have to be repeated here or they silently stop
    # being sent for anything under /assets/ or /.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self'" always;
    }

    # React Router client-side routes — always fall back to index.html so a
    # hard refresh on /collection or /product/:id doesn't 404 at the edge.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self'" always;
    }
}
