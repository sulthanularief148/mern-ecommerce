server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx quirk: a location block that declares its own add_header entirely
    # replaces the server-level list for that location instead of adding to
    # it, so every location below that sets Cache-Control must repeat these
    # too or the security headers silently stop being sent.

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Fingerprinted assets (Vite hashes filenames) can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://checkout.razorpay.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com https://images.unsplash.com https://www.google-analytics.com https://www.facebook.com; connect-src 'self' https://*.razorpay.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://maps.google.com https://www.google.com" always;
    }

    # React Router client-side routes — always fall back to index.html so a
    # hard refresh on /collection or /product/:id doesn't 404 at the edge.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # script-src/frame-src allow Razorpay's checkout widget (loaded from
        # index.html) and GA4/Meta Pixel (both inert no-ops until
        # VITE_GA4_ID/VITE_META_PIXEL_ID are set — see client/src/lib/analytics.js);
        # frame-src also allows the Google Maps embed on the Contact page
        # (maps.google.com/maps?...&output=embed can redirect to www.google.com/maps/embed).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://checkout.razorpay.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com https://images.unsplash.com https://www.google-analytics.com https://www.facebook.com; connect-src 'self' https://*.razorpay.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://maps.google.com https://www.google.com" always;
    }
}
