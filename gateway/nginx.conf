# Single entry point for the storefront + API: same-origin in production
# means the browser never needs CORS for the client<->server calls at all,
# and TLS termination / rate limiting / caching all have one place to live.

# Docker's embedded DNS (127.0.0.11) re-resolves service names on every TTL
# instead of once at nginx startup — without this, nginx caches the upstream
# container's old IP forever and returns 502s the moment client/server gets
# recreated (a deploy, a restart, a rebuild), until nginx itself restarts.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /health {
        access_log off;
        return 200 "ok\n";
    }

    # Search engines expect /sitemap.xml at the root, not under /api/ — proxy
    # it there specifically rather than exposing the whole API at the root.
    location = /sitemap.xml {
        set $upstream_server server:4000;
        proxy_pass http://$upstream_server/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        # NOTE: proxy_pass with a variable does NOT rewrite the matched
        # location prefix the way a static proxy_pass does — it forwards the
        # original request URI as-is. Since the server's own routes are
        # already mounted at /api/..., that's exactly what we want: no
        # trailing path here, or requests end up double-prefixed (/api/api/...).
        set $upstream_server server:4000;
        proxy_pass http://$upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /api/auth /api/auth;
    }

    location / {
        set $upstream_client client:80;
        proxy_pass http://$upstream_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
